kind = "web"
previewPath = "/"
title = "ChavrutAI"
version = "1.0.0"
id = "artifacts/chavrutai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23737

[services.development]
run = "pnpm --filter @workspace/chavrutai run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/chavrutai", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"
PORT = "23737"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/chavrutai/dist/index.mjs" ]

[services.production.run.env]
PORT = "23737"
BASE_PATH = "/"
NODE_ENV = "production"

[services.env]
PORT = "23737"
BASE_PATH = "/"
